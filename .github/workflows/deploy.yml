name: Deploy to GitHub Pages

on:
  # Deploy every time main changes.
  push:
    branches: [main]
  # Rebuild every night just after midnight Eastern, so the copy of the home
  # page that visitors without JavaScript see is never more than a day old.
  schedule:
    - cron: "15 5 * * *"
  # Allow a manual run from the Actions tab.
  workflow_dispatch:

# Let this workflow read the repository and publish a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits for the running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Install, build, and upload the site
        uses: withastro/action@v6
        with:
          node-version: 26
          # Run the tests first; a failing test stops the deploy.
          build-cmd: npm run ci

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
